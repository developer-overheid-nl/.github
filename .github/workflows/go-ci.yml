name: Go CI

# Herbruikbare Go-CI: golangci-lint, tests met coverage-drempel en een
# Docker-build als controle. Deze workflow pusht geen images; dat doet deploy.yml.

on:
  workflow_call:
    inputs:
      golangci-lint-version:
        required: false
        type: string
        default: v2.12.2
      coverage-threshold:
        description: "Minimale totale coverage in procenten; 0 schakelt de drempel uit"
        required: false
        type: number
        default: 80
      coverpkg:
        description: "Waarde voor go test -coverpkg, bijv. ./... (leeg = standaard)"
        required: false
        type: string
        default: ""
      docker-build:
        description: "Controleer dat de Docker-image bouwt (zonder push)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ inputs.golangci-lint-version }}
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Run tests
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
          COVERPKG: ${{ inputs.coverpkg }}
        run: |
          set -euo pipefail

          ARGS=(-coverprofile=coverage.out)
          if [[ -n "$COVERPKG" ]]; then
            ARGS+=("-coverpkg=$COVERPKG")
          fi

          go test "${ARGS[@]}" ./...
          go tool cover -func=coverage.out | tee coverage.txt

          coverage="$(awk '/^total:/ { gsub(/%/, "", $3); print $3 }' coverage.txt)"
          {
            echo "### Go coverage"
            echo
            echo "Total coverage: ${coverage}%"
            if [[ "$THRESHOLD" != "0" ]]; then
              echo "Required minimum: ${THRESHOLD}%"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          awk -v coverage="$coverage" -v threshold="$THRESHOLD" 'BEGIN {
            if (threshold + 0 > 0 && coverage + 0 < threshold + 0) {
              printf("coverage %.1f%% is below required %.1f%%\n", coverage, threshold)
              exit 1
            }
          }'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: inputs.docker-build
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
